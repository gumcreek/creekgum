<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>LOGAN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@200..700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #d9f7be;

      --text: #1f2937;
      --muted: #5b6472;

      --border: #b7d9bb;

      --pink: #ff3ea5;

      --font: "Cascadia Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);

      color: var(--text);

      font-family: var(--font);

      line-height: 1.8;

      letter-spacing: -0.03em;

      min-height: 100vh;

      overflow-x: hidden;
    }

    a {
      color: inherit;

      text-decoration-color: var(--pink);

      text-decoration-thickness: 2px;

      text-underline-offset: 4px;

      transition:
        text-underline-offset .2s ease,
        opacity .2s ease;
    }

    a:hover {
      text-underline-offset: 7px;
    }

    .container {
      width: min(1200px, calc(100% - 2rem));

      margin-inline: auto;
    }

    header {
      padding: 1.5rem 0;
    }

    .nav {
      display: flex;

      justify-content: center;

      align-items: center;
    }

    .nav-links {
      display: flex;

      gap: 2rem;

      list-style: none;

      padding: 0;
      margin: 0;
    }

    .nav-links a {
      text-decoration: none;

      font-weight: 700;

      font-size: .95rem;
    }

    .hero {
      display: flex;
      justify-content: center;
    
      margin-top: -1rem;
      margin-bottom: 5rem;
    
      overflow: visible;
    }
    
    #logo {
      width: min(96vw, 1900px);
    
      overflow: visible;
    
      display: block;
    }
    
    #logan-text {
      fill: #ff3ea5;
    
      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;
    
      font-size: 540px;
    
      font-weight: 900;
    
      letter-spacing: -0.12em;
    
      transform-origin: center;
    
      transform:
        matrix(
          1,
          0,
          -0.18,
          1,
          0,
          0
        )
        scale(1,1.15);
    
      cursor: default;
    }
    .logo-letter {
      pointer-events: auto;
    }
    .section {
      margin-block: 5rem;
    }

    .section-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 1rem;

      margin-bottom: 2rem;
    }

    .section-title {
      margin: 0;

      font-size: clamp(1.5rem, 4vw, 2.5rem);

      line-height: 1;
    }

    .timeline {
      display: grid;

      gap: 1.5rem;
    }

    .post {
      border-bottom: 1px solid var(--border);

      padding-bottom: 1.5rem;
    }

    .post h3 {
      margin: 0 0 .5rem;

      font-size: 1.25rem;

      line-height: 1.3;
    }

    .meta {
      color: var(--muted);

      font-size: .95rem;
    }

    .tags {
      display: flex;

      flex-wrap: wrap;

      gap: .5rem;

      margin-top: .75rem;
    }

    .tag {
      border: 1px solid var(--border);

      padding: .2rem .7rem;

      border-radius: 999px;

      font-size: .85rem;

      text-decoration: none;

      background: rgba(255,255,255,.35);
    }

    footer {
      margin-top: 6rem;

      padding: 3rem 0;

      border-top: 1px solid var(--border);
    }

    .footer-grid {
      display: flex;

      justify-content: space-between;

      flex-wrap: wrap;

      gap: 2rem;
    }

    .footer-links {
      list-style: none;

      padding: 0;
      margin: 0;

      display: grid;

      gap: .5rem;
    }

    @media (max-width: 700px) {

      .nav-links {
        gap: 1rem;
      }

      .section-header {
        flex-direction: column;

        align-items: flex-start;
      }

      .hero {
        margin-bottom: 3rem;
      }

    }

  </style>
</head>

<body>

  <header class="container">

    <nav class="nav">

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
      </ul>

    </nav>

  </header>

  <main class="container">

    <section class="hero">

      <svg
        id="logo"
        viewBox="0 0 2400 700"
        xmlns="http://www.w3.org/2000/svg"
      >
    
        <text
          id="logan-text"
          x="50%"
          y="52%"
          dominant-baseline="middle"
          text-anchor="middle"
        >
          LOGAN
        </text>
    
      </svg>
    
    </section>

    <section class="section">

      <div class="section-header">

        <h2 class="section-title">
          Latest Posts
        </h2>

        <a href="#">
          View archive →
        </a>

      </div>

      <div class="timeline">

        <article class="post">

          <h3>
            <a href="#">
              Building Cool Things on the Internet
            </a>
          </h3>

          <div class="meta">
            September 2026
          </div>

          <div class="tags">
            <a class="tag" href="#">#design</a>
            <a class="tag" href="#">#web</a>
          </div>

        </article>

        <article class="post">

          <h3>
            <a href="#">
              Thoughts on Creative Coding
            </a>
          </h3>

          <div class="meta">
            August 2026
          </div>

          <div class="tags">
            <a class="tag" href="#">#javascript</a>
            <a class="tag" href="#">#frontend</a>
          </div>

        </article>

        <article class="post">

          <h3>
            <a href="#">
              Why Personal Websites Matter Again
            </a>
          </h3>

          <div class="meta">
            July 2026
          </div>

          <div class="tags">
            <a class="tag" href="#">#writing</a>
            <a class="tag" href="#">#internet</a>
          </div>

        </article>

      </div>

    </section>

  </main>

  <footer class="container">

    <div class="footer-grid">

      <div>
        © 2026 LOGAN
      </div>

      <ul class="footer-links">
        <li><a href="#">GitHub</a></li>
        <li><a href="#">Bluesky</a></li>
        <li><a href="#">Email</a></li>
      </ul>

    </div>

  </footer>
  <script>
  
  const text = document.getElementById('logan-text');
  
  const letters = [];
  
  const textContent = text.textContent;
  
  text.textContent = '';
  
  [...textContent].forEach((char, i) => {
  
    const tspan = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "tspan"
    );
  
    tspan.textContent = char;
  
    tspan.setAttribute(
      'dx',
      i === 0 ? '0' : '-55'
    );
  
    tspan.classList.add('logo-letter');
  
    text.appendChild(tspan);
  
    letters.push(tspan);
  
  });
  
  letters.forEach(letter => {
  
    let animating = false;
  
    letter.addEventListener('mouseenter', () => {
  
      if (animating) return;
  
      animating = true;
  
      letter.animate(
        [
          {
            transform: 'translateY(0px) scaleY(1)'
          },
  
          {
            transform: 'translateY(-34px) scaleY(1.08)'
          },
  
          {
            transform: 'translateY(8px) scaleY(0.96)'
          },
  
          {
            transform: 'translateY(-10px) scaleY(1.02)'
          },
  
          {
            transform: 'translateY(0px) scaleY(1)'
          }
        ],
        {
          duration: 950,
          easing: 'cubic-bezier(.22,1,.36,1)'
        }
      );
  
      setTimeout(() => {
        animating = false;
      }, 950);
  
    });
  
  });
  
  </script>

</body>
</html>
